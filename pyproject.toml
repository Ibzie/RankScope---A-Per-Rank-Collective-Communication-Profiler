[project]
name = "rankscope"
version = "0.1.0"
description = "Per-rank collective communication profiler"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rankscope"]

# Pin torch to the CUDA 13.0 wheel index. `explicit = true` means only the
# packages listed in [tool.uv.sources] may come from this index; everything
# else still resolves from PyPI.
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
